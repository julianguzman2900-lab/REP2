<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>EcoEventos</title>
    <link rel="stylesheet" href="/css/estilos.css">
</head>

<body>

    <header>
        <h1>EcoEventos</h1>
        <h2>Registro de asistentes</h2>
    </header>

    <main>

        <section>

            <p>
                <strong>Asistencias registradas</strong>
            </p>

            <a href="/asistencias">
                Ver asistentes
            </a>

        </section>

        <br>

        <section>

            <h3>Confirmar asistencia</h3>

            <form action="/confirmar" method="POST">

                <div>

                    <label for="nombre">
                        Nombre:
                    </label>

                    <input 
                        type="text"
                        id="nombre"
                        name="nombre"
                        required
                    >

                </div>

                <br>

                <div>

                    <label for="correo">
                        Correo:
                    </label>

                    <input 
                        type="email"
                        id="correo"
                        name="correo"
                        required
                    >

                </div>

                <br>

                <button type="submit">
                    Registrar
                </button>

            </form>

        </section>

    </main>

</body>

</html>
