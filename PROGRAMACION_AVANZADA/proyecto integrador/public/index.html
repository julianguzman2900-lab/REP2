<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>identificacion</title>
    <link rel="stylesheet" href="css/formulario.css">
</head>
<body>
    <header>
        <h1>Generador Web de Actividades y Contenido Dinámico</h1>
    </header>
    <main>
        <br>
        <section>
            <h3>Formulario de Identificacion </h3>
            <br>
            <form action="/identificar" method="POST">

                <div>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="EJ:julian" required>
                </div>
                <br>
                <div>
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido" placeholder="EJ:Guzman" required>
                </div>
                <br>
                <button type="submit">enviar</button>
                <br>
            </form>
        </section>
    </main>
</body>
</html>
