<head>

            padding: 20px;

            background: rgb(176, 176, 180);

    <section id="estudios">

        <table>
            <thead>
                <tr>
                    <th>Curso</th>
                    <th>Institución</th>

            <tbody>
                <tr>
                    <td>Desarrollo Web HTML</td>
                    <td>CreaIA</td>
                </tr>
                <tr>
                    <td>Programación Básica</td>

</body>
</html>
