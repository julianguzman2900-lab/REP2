<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Página Web de integración</title>
    <link rel="stylesheet" href="css/estilos.css">

</head>
<body>
    <header>
        <h1> Sitio de integración de las nuevas tecnologías </h1>

        <div class="caja-conexion">
            <h2>Identificación de usuarios</h2>
<form id="formulario" action="/enviar_datos" method="POST">
    <label for="nombre">Nombre:</label>
    <input id="nombre" name="nombre" type="text" placeholder="Ej: Diego" required>
    <br>
    <label for="id">ID de usuario:</label>
    <input id="id" name="id" type="text" placeholder="Ej: 12345" required>
    <br>
    <button type="submit">Enviar</button>

        </div>

    </header>
</body>
</html>
