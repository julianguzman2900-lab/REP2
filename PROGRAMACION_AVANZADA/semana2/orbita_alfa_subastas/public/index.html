<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>SUBASTA ORBITA ALFA</title>
   <link rel="stylesheet" href="/css/estilos.css">

</head>

<body>

    <header>
        <h1>Orbita Alfa Salvage</h1>
        <h2>Sistema de subasstas</h2>
    </header>

    <main>

        <section>

            <p><strong>REALIZAR OFERTA</strong></p>

           

        </section>

        <br>

        <section>

            <h3>Formulario de Puja</h3>

            <form action="/subasta" method="POST">


                <div>

                    <label for="id_lote">ID Lote:</label>

                    <input 
                        type="number"
                        id="id_lote"
                        name="idLote"
                        required
                    >

                </div>

                <br>

                <div>

                    <label for="nombre_usuario">Nombre usuario:</label>

                    <input 
                        type="text"
                        id="usuario"
                        name="comerciante"
                        required
                    >

                </div>

                <br>

                 <div>

                    <label for="oferta">Monto puja:</label>

                    <input 
                        type="number"
                        id="oferta"
                        name="oferta"
                        required
                    >

                </div>

                <br>

                 <button type="submit">Ofertar</button>

                <br>
               <br>
               

                <a href="/consultar">
                Estado de la subasta</a>



            </form>

        </section>

    </main>

</body>

</html>
