<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Librería El Saber</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366F1',
                        danger: '#EF4444',
                        success: '#10B981',
                        info: '#0EA5E9',
                        light: '#F8FAFC',
                        dark: '#1E293B'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        'modern': '0 10px 25px -5px rgba(99, 102, 241, 0.15), 0 8px 10px -6px rgba(99, 102, 241, 0.1)',
                    }
                }
            }
        }
    </script>
   <style type="text/tailwindcss">
    @layer utilities {
        .transition-custom {
            transition-property: all;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 300ms;
        }
        .input-focus {
            outline: none;
            border-color: #6366F1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }
    }
</style>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-blue-50 min-h-screen flex items-center justify-center font-sans">
    <div class="w-full max-w-md px-4 py-8">
        <!-- Tarjeta Principal -->
        <div class="bg-white rounded-3xl shadow-modern p-8 transform hover:scale-[1.01] transition-custom">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-primary/10 text-primary rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i class="fa fa-book fa-3x"></i>
                </div>
                <h2 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-dark mb-2">Panel de Administración</h2>
                <p class="text-gray-500">Accede para gestionar tu librería</p>
            </div>

            <!-- Mensaje de alerta -->
            <div id="mensaje" class="hidden mb-6 p-4 rounded-xl text-center font-medium"></div>

            <!-- Formulario -->
            <form id="formLogin" class="space-y-5">
                <div class="space-y-2">
                    <label class="block text-gray-700 font-medium">Usuario</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                            <i class="fa fa-user"></i>
                        </span>
                        <input type="text" id="usuario" class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl input-focus outline-none transition-custom" placeholder="Ingresa tu usuario" required>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-gray-700 font-medium">Contraseña</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                            <i class="fa fa-lock"></i>
                        </span>
                        <input type="password" id="contrasena" class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl input-focus outline-none transition-custom" placeholder="Ingresa tu contraseña" required>
                    </div>
                </div>

                <button type="submit" class="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-primary/20 hover:shadow-primary/30 transform hover:-translate-y-0.5 transition-custom">
                    <i class="fa fa-sign-in mr-2"></i> Iniciar Sesión
                </button>
            </form>

            <div class="mt-8 text-center">
                <a href="../index.html" class="text-gray-500 hover:text-primary font-medium transition-custom inline-flex items-center">
                    <i class="fa fa-arrow-left mr-2"></i> Volver a la tienda
                </a>
            </div>
        </div>

        <p class="text-center text-gray-400 text-sm mt-6">© 2026 Librería El Saber - Todos los derechos reservados</p>
    </div>

    <script>
        const formLogin = document.getElementById('formLogin');
        const mensaje = document.getElementById('mensaje');

        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value;
            const contrasena = document.getElementById('contrasena').value;

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, contrasena })
                });

                const datos = await res.json();
                
                if (datos.exito) {
                    localStorage.setItem('adminLogueado', 'true');
                    localStorage.setItem('adminNombre', datos.usuario);
                    mensaje.className = 'mb-6 p-4 rounded-xl bg-success/10 text-success text-center font-medium';
                    mensaje.innerHTML = '<i class="fa fa-check-circle mr-2"></i> ¡Bienvenido! Redirigiendo...';
                    mensaje.classList.remove('hidden');
                    setTimeout(() => window.location.href = 'panel.html', 1200);
                } else {
                    mensaje.className = 'mb-6 p-4 rounded-xl bg-danger/10 text-danger text-center font-medium';
                    mensaje.innerHTML = '<i class="fa fa-exclamation-circle mr-2"></i> ' + datos.mensaje;
                    mensaje.classList.remove('hidden');
                }
            } catch (error) {
                mensaje.className = 'mb-6 p-4 rounded-xl bg-danger/10 text-danger text-center font-medium';
                mensaje.innerHTML = '<i class="fa fa-wifi mr-2"></i> Error de conexión';
                mensaje.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
